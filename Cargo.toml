[package]
name = "erm"
version = "0.1.0"
edition = "2024"

[features]
default = ["ron"]
ron = ["dep:ron"]
json = ["dep:base64", "dep:serde_json"]

[lints.rust]
dead_code = "deny"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
base64 = { version = "0.23.1", optional = true }
bytes = { version = "1.12.1", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
eyre = "0.6.14"
futures = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
reqwest = { version = "0.13.4", features = ["http2", "rustls", "stream"] }
ron = { version = "0.12.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
proptest = "1.9.0"
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["test-util"] }
