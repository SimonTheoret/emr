[package]
name = "erm"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
bytes = { version = "1.12.1", features = ["serde"] }
eyre = "0.6.14"
futures = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
reqwest = { version = "0.13.4", features = ["stream"] }
tokio = { version = "1.53.1", features = ["full"] }
url = { version = "2.5.8", features = ["serde"] }
