[package]
name = "erm"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
bytes = { version = "1.12.1", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
dir_walker = "0.1.9"
eyre = "0.6.14"
futures = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
notify = "8.2.0"
reqwest = { version = "0.13.4", features = ["http2", "rustls", "stream"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }

[dev-dependencies]
proptest = "1.9.0"
tempfile = "3.23.0"
