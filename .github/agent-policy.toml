[repository]
expected = "SimonTheoret/emr"
default_branch = "main"

[agents]
model = "gpt-5.3-codex"
effort = "medium"
codex_version = "0.163.0"
codex_action_sha = "83eeca45b831921e73d1f6a7955efccc568fe4e8"
max_concurrent_implementations = 4
max_repair_runs = 3

[identity]
# These are non-secret GitHub variables. Configure separate OpenAI federation
# rules for read-only and implementation jobs and restrict each rule to the
# repository plus the exact workflow_ref documented in docs/agent-workflow.md.
audience_variable = "OPENAI_WIF_AUDIENCE"
read_rule_variable = "OPENAI_READ_FEDERATION_RULE_ID"
implementation_rule_variable = "OPENAI_IMPLEMENT_FEDERATION_RULE_ID"

[actors]
maintainers = ["SimonTheoret"]
trusted_authors = ["SimonTheoret"]

[paths]
protected = [".github/**", ".agents/**", "AGENTS.md"]

[limits]
max_patch_bytes = 2097152
max_changed_files = 100

[rollout]
# shadow-triage | planning | full
stage = "full"

[labels]
priority = ["low", "medium", "high", "extreme"]
blast = ["small", "medium", "big", "huge"]
risk = ["low", "medium", "high", "extreme"]
states = [
  "needs-triage",
  "needs-info",
  "planning",
  "awaiting-approval",
  "queued",
  "implementing",
  "reviewing",
  "repairing",
  "blocked",
  "done",
]
