name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Stages: fmt, actionlint, clippy and test first; then the Nix packages and the
# Windows and macOS builds; then the integration tests and Docker images. Jobs
# after the first stage use `!cancelled() && !failure()` so they still run when
# clippy and test are skipped because no Rust-related file changed.
jobs:
  fmt:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # purge old Nix store caches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # fmt, clippy and test use the same dev shell, so they share one Nix store cache.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ hashFiles('**/*.nix', '**/flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-devshell-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-devshell-
          purge-created: 3600
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      # The profile roots the dev shell, so it survives the cache's garbage collection.
      - name: Verify Rust, Nix, and shell formatting
        run: nix develop --profile "$RUNNER_TEMP/dev-shell" --command just format-check

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Lint GitHub Actions workflows
        run: nix develop --command actionlint -color

  changes:
    name: detect Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Pull requests compare against their base and pushes against the previous
      # tip; scheduled and manual runs, or an unknown base, always run the checks.
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            *) base= ;;
          esac
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            rust=true
          elif git diff --quiet "$base" HEAD -- '*.rs' Cargo.toml Cargo.lock flake.nix flake.lock rust-toolchain.toml; then
            rust=false
          else
            rust=true
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  clippy:
    name: cargo clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # purge old Nix store caches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # fmt, clippy and test use the same dev shell, so they share one Nix store cache.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ hashFiles('**/*.nix', '**/flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-devshell-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-devshell-
          purge-created: 3600
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      - name: Restore and save Cargo build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ github.job }}-
      # The profile roots the dev shell, so it survives the cache's garbage collection.
      - run: nix develop --profile "$RUNNER_TEMP/dev-shell" --command cargo clippy --all-targets --all-features

  test:
    name: cargo test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # purge old Nix store caches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # fmt, clippy and test use the same dev shell, so they share one Nix store cache.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ hashFiles('**/*.nix', '**/flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-devshell-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-devshell-
          purge-created: 3600
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      - name: Restore and save Cargo build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ github.job }}-
      # The profile roots the dev shell, so it survives the cache's garbage collection.
      - run: nix develop --profile "$RUNNER_TEMP/dev-shell" --command cargo test

  windows-build:
    name: cargo build --all-targets (${{ matrix.runner }})
    needs: [fmt, actionlint, clippy, test]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Build on Windows
        if: runner.os == 'Windows'
        run: cargo build --all-targets

  macos-build:
    name: nix package (aarch64-darwin)
    needs: [fmt, actionlint, clippy, test]
    if: ${{ !cancelled() && !failure() }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix build --no-link --print-build-logs .#packages.aarch64-darwin.default

  cargo-dependencies:
    name: Cargo dependencies are current
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-outdated
        run: cargo install --locked cargo-outdated --version 0.19.0 --features vendored-openssl
      - name: Check direct dependency versions
        run: cargo outdated --root-deps-only --exit-code 1
      - name: Show warning
        if: failure()
        run: echo "::warning title=Cargo dependencies check failed::Cargo dependencies are outdated or the check could not run; see the job log."

  package:
    name: nix package (${{ matrix.system }})
    needs: [fmt, actionlint, clippy, test]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # purge old Nix store caches
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ github.job }}-${{ matrix.system }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ github.job }}-${{ matrix.system }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ github.job }}-${{ matrix.system }}-
          purge-created: 3600
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      # The out-link roots the package, so it survives the cache's garbage collection
      # and the integration test restores it instead of rebuilding.
      - run: nix build --out-link result --print-build-logs .#packages.${{ matrix.system }}.default

  static:
    name: nix static package (${{ matrix.system }})
    needs: [fmt, actionlint, clippy, test]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # purge old Nix store caches
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ github.job }}-${{ matrix.system }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ github.job }}-${{ matrix.system }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ github.job }}-${{ matrix.system }}-
          purge-created: 3600
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      # The out-link roots the package, so it survives the cache's garbage collection
      # and the integration test restores it instead of rebuilding.
      - run: nix build --out-link result --print-build-logs .#packages.${{ matrix.system }}.static

  integration:
    name: ${{ matrix.check }} test (${{ matrix.system }})
    needs: [package, static]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # purge old Nix store caches
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
        check: [integration, integration-static]
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
          # Share the Nix store cache of the job that built the package under test.
          - check: integration
            cache: package
          - check: integration-static
            cache: static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ matrix.cache }}-${{ matrix.system }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ matrix.cache }}-${{ matrix.system }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ matrix.cache }}-${{ matrix.system }}-
          purge-created: 3600
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      - run: nix build --no-link --print-build-logs .#checks.${{ matrix.system }}.${{ matrix.check }}

  docker-image:
    name: docker image (${{ matrix.system }})
    needs: static
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix build --no-link --print-build-logs .#packages.${{ matrix.system }}.dockerImage
      - name: Export image for scanning
        run: cp "$(nix build --no-link --print-out-paths .#packages.${{ matrix.system }}.dockerImage)" erm-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: erm-image-${{ matrix.system }}
          path: erm-image.tar.gz
          retention-days: 1

  image-scan:
    name: scan docker image (${{ matrix.system }})
    needs: docker-image
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: erm-image-${{ matrix.system }}
      - name: Load image
        run: docker load --input erm-image.tar.gz
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: erm:0.1.0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  nix-dependencies:
    name: Nix dependencies are current
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check flake.lock
        run: |
          nix flake update
          git diff --exit-code -- flake.lock
      - name: Show warning
        if: failure()
        run: echo "::warning title=Nix dependencies check failed::Nix flake inputs are outdated or the check could not run; see the job log."
