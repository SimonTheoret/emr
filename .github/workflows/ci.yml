name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &install-nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - &devshell-cache
        name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-devshell-${{ hashFiles('**/*.nix', '**/flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-devshell-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-devshell-
          purge-created: 3600
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      - name: Verify Rust, Nix, and shell formatting
        run: nix develop --profile "$RUNNER_TEMP/dev-shell" --command just format-check

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - *checkout
      - *install-nix
      - *devshell-cache
      - name: Lint GitHub Actions workflows
        run: nix develop --profile "$RUNNER_TEMP/dev-shell" --command actionlint -color

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - *checkout
      - *install-nix
      - *devshell-cache
      - &cargo-cache
        name: Restore and save Cargo build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - run: nix develop --profile "$RUNNER_TEMP/dev-shell" --command cargo clippy --all-targets --all-features

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - *checkout
      - *install-nix
      - *devshell-cache
      - *cargo-cache
      - run: nix develop --profile "$RUNNER_TEMP/dev-shell" --command cargo test

  windows-build:
    name: cargo build --all-targets (${{ matrix.runner }})
    needs: [fmt, actionlint, clippy, test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
    steps:
      - *checkout
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - *cargo-cache
      - name: Build on Windows
        if: runner.os == 'Windows'
        run: cargo build --all-targets

  macos-build:
    name: nix package (aarch64-darwin)
    needs: [fmt, actionlint, clippy, test]
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - *checkout
      - *install-nix
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ github.job }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ github.job }}-
          gc-max-store-size-macos: 1G
          purge: true
          purge-prefixes: nix-${{ github.job }}-
          purge-created: 3600
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      - run: nix build --out-link result --print-build-logs .#packages.aarch64-darwin.default

  # cargo-dependencies:
  #   name: Cargo dependencies are current
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 30
  #   continue-on-error: true
  #   permissions:
  #     contents: read
  #     actions: write
  #   steps:
  #     - *checkout
  #     - *install-nix
  #     - *devshell-cache
