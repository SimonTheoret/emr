  #       run: nix develop --profile "$RUNNER_TEMP/dev-shell" --command cargo outdated --root-deps-only --exit-code 1
  #     - name: Show warning
  #       if: failure()
  #       run: echo "::warning title=Cargo dependencies check failed::Cargo dependencies are outdated or the check could not run; see the job log."

  package:
    name: nix ${{ matrix.package }} package (${{ matrix.system }})
    needs: [fmt, actionlint, clippy, test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
        package: [default, static]
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
    steps:
      - *checkout
      - *install-nix
      - &package-cache
        name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ matrix.package }}-${{ matrix.system }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ matrix.package }}-${{ matrix.system }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ matrix.package }}-${{ matrix.system }}-
          purge-created: 3600
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      - run: nix build --out-link result --print-build-logs .#packages.${{ matrix.system }}.${{ matrix.package }}

  integration:
    name: ${{ matrix.check }} test (${{ matrix.system }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
        check: [integration, integration-static]
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
          - check: integration
            package: default
          - check: integration-static
            package: static
    steps:
      - *checkout
      - *install-nix
      - *package-cache
      - run: nix build --no-link --print-build-logs .#checks.${{ matrix.system }}.${{ matrix.check }}

  docker-image:
    name: docker image (${{ matrix.system }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
    steps:
      - *checkout
      - *install-nix
      - name: Export image for scanning
        run: |
          nix build --out-link result --print-build-logs .#packages.${{ matrix.system }}.dockerImage
          cp result erm-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: erm-image-${{ matrix.system }}
          path: erm-image.tar.gz
          retention-days: 1

  image-scan:
    name: scan docker image (${{ matrix.system }})
    needs: docker-image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: erm-image-${{ matrix.system }}
      - name: Load image
        id: image
        run: |
          image_id=$(python3 - <<'PY'
          import hashlib
          import json
          import tarfile

          with tarfile.open("erm-image.tar.gz", "r:*") as archive:
              manifests = [entry for entry in archive.getmembers() if entry.name == "manifest.json"]
              if len(manifests) != 1 or not manifests[0].isfile():
                  raise SystemExit("Image artifact must contain exactly one regular manifest.json")
              manifest = json.load(archive.extractfile(manifests[0]))
              if not isinstance(manifest, list) or len(manifest) != 1 or not isinstance(manifest[0], dict):
                  raise SystemExit("Image artifact must describe exactly one image")
              config_name = manifest[0].get("Config")
              if not isinstance(config_name, str) or not config_name:
                  raise SystemExit("Image artifact must name its image config")
              configs = [entry for entry in archive.getmembers() if entry.name == config_name]
              if len(configs) != 1 or not configs[0].isfile():
                  raise SystemExit("Image artifact must contain exactly one regular image config")
              print("sha256:" + hashlib.sha256(archive.extractfile(configs[0]).read()).hexdigest())
          PY
          )
          docker load --input erm-image.tar.gz
          test "$(docker image inspect --format '{{.Id}}' "$image_id")" = "$image_id"
          echo "id=$image_id" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.id }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

