name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.3
      - name: Verify Rust, Nix, and shell formatting
        run: nix develop --command just format-check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.3
      - run: nix develop --command cargo clippy --all-targets --all-features

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.3
      - run: nix develop --command cargo test

  build:
    name: cargo build --all-targets (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.3
        if: runner.os == 'Linux'
      - name: Build with the Flake toolchain
        if: runner.os == 'Linux'
        run: nix develop --command cargo build --all-targets
      - name: Install Windows Rust toolchain
        if: runner.os == 'Windows'
        run: rustup toolchain install stable --profile minimal
      - name: Build on Windows
        if: runner.os == 'Windows'
        run: cargo +stable build --all-targets

  nix:
    name: build every flake output (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
            integration: true
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            integration: true
          - system: aarch64-darwin
            runner: macos-26
            integration: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.3
      - name: Build outputs
        run: |
          nix build --no-link --print-build-logs \
            .#packages.${{ matrix.system }}.default \
            .#packages.${{ matrix.system }}.static \
            .#packages.${{ matrix.system }}.dockerImage \
            .#devShells.${{ matrix.system }}.default \
            .#formatter.${{ matrix.system }}
      - name: Build integration test
        if: matrix.integration
        run: nix build --no-link --print-build-logs .#checks.${{ matrix.system }}.integration
