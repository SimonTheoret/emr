name: Merge policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]

concurrency:
  group: merge-policy-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  merge-policy:
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve-pr ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: write
      statuses: write
    steps:
      - name: Check out trusted policy from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Validate current-head approval and resolved conversations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/agentctl.py merge-policy-event --event "$GITHUB_EVENT_PATH"
