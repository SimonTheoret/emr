name: Agent commands

on:
  issue_comment:
    types: [created]

concurrency:
  group: agent-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  command:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Validate command or clarification answer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/agentctl.py handle-comment --event "$GITHUB_EVENT_PATH"
