name: Main recovery

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: main-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check out failed main without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Stage recovery controller from pre-failure main
        env:
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          CONTROLLER_DIR: ${{ runner.temp }}/recovery-controller
        run: |
          mkdir -p "$CONTROLLER_DIR"
          git archive "$FAILED_SHA^" .github/scripts .github/agent-policy.toml | tar -x -C "$CONTROLLER_DIR"
      - name: Configure recovery identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Rerun once or create validated inverse PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTROLLER_DIR: ${{ runner.temp }}/recovery-controller
        run: python3 "$CONTROLLER_DIR/.github/scripts/rollback.py" recover --event "$GITHUB_EVENT_PATH" --root "$GITHUB_WORKSPACE"
