name: Agent plan

on:
  repository_dispatch:
    types: [agent-plan]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to plan
        required: true
        type: number

concurrency:
  group: agent-plan-${{ github.event.client_payload.issue || inputs.issue }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      id-token: write
    env:
      ISSUE_NUMBER: ${{ github.event.client_payload.issue || inputs.issue }}
      OPENAI_FEDERATION_RULE_ID: ${{ vars.OPENAI_READ_FEDERATION_RULE_ID }}
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Snapshot issue and triage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/agentctl.py snapshot-issue --issue "$ISSUE_NUMBER" --output "$RUNNER_TEMP/issue.json"
      - name: Prepare workload identity and permissions
        id: codex
        env:
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
        run: >-
          python3 .github/scripts/prepare_codex.py
          --audience "$OPENAI_WIF_AUDIENCE"
          --context "$RUNNER_TEMP/issue.json"
          --task .github/codex/prompts/plan.md
          --role read
          --output-dir "$RUNNER_TEMP/codex-auth"
      - name: Run read-only planning agent
        uses: openai/codex-action@83eeca45b831921e73d1f6a7955efccc568fe4e8 # v1.13
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          OPENAI_FEDERATION_RULE_ID: ${{ env.OPENAI_FEDERATION_RULE_ID }}
          OPENAI_IDENTITY_TOKEN_FILE: ${{ steps.codex.outputs.token_file }}
          OPENAI_WORKLOAD_IDENTITY_CONTEXT: '{"instance_id":"${{ github.repository }}:plan:${{ env.ISSUE_NUMBER }}:${{ github.run_id }}"}'
        with:
          prompt-file: ${{ steps.codex.outputs.prompt }}
          output-file: ${{ runner.temp }}/codex-auth/result.json
          output-schema-file: .github/codex/schemas/plan.json
          codex-home: ${{ steps.codex.outputs.codex_home }}
          permission-profile: agent-read
          safety-strategy: drop-sudo
          model: gpt-5.3-codex
          effort: medium
          codex-version: 0.163.0
          allow-bots: true
      - name: Preserve structured result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan-${{ env.ISSUE_NUMBER }}-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-auth/result.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    env:
      ISSUE_NUMBER: ${{ github.event.client_payload.issue || inputs.issue }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plan-${{ env.ISSUE_NUMBER }}-${{ github.run_id }}
          path: ${{ runner.temp }}/result
      - name: Validate and publish plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/agentctl.py publish-plan --issue "$ISSUE_NUMBER" --result "$RUNNER_TEMP/result/result.json"
