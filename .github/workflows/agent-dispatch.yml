name: Agent dispatcher

on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [agent-dispatch]
  workflow_dispatch:

concurrency:
  group: agent-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Fill available implementation slots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/agentctl.py schedule
