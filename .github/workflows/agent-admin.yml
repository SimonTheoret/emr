name: Agent administration

on:
  workflow_dispatch:
    inputs:
      sync_labels:
        description: Create or update lifecycle labels
        type: boolean
        default: true

jobs:
  sync-labels:
    if: ${{ inputs.sync_labels }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Synchronize labels from policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/agentctl.py bootstrap-labels
