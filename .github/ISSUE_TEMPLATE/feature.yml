name: Feature request
description: Propose a behavior or workflow improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should erm solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility constraints
      description: Note CLI, mock-format, HTTP, packaging, or deployment constraints.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or designs you considered.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This request contains no secrets or private traffic recordings.
          required: true
